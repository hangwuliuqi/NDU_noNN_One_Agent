# 本文件是项目唯一的运行参数入口。程序先从这里构建 HOCON 配置树，
# 再允许使用命令行 --set key=value 临时覆盖任意叶子配置项。
# 注意：参数名称必须保持小写；面向 LLM 的 meaning、模型 ID 和提示词路径仍使用英文。

project {
  # 项目名称。主要用于标识当前优化任务，建议使用不含空格的小写英文名称。
  name = "dual_band_dipole_optimization"

  # 全局随机种子。控制候选越界随机修复、mock 候选生成和 mock 曲线噪声，
  # 使用相同种子和相同输入时有助于复现实验。
  seed = 20261009

  # 运行数据目录。样本池、HFSS 请求/响应和日志都保存在此目录下。
  # 相对路径以本配置文件所在目录为基准；也可以填写绝对路径。
  runtime_dir = "runtime"

  # 初始真实样本数据包。每行包含九个变量和完整 HFSS S11 曲线向量。
  initial_parquet = "data/initial_samples/Sample_40_with_results.parquet"

  # true: 导入初始 Parquet；false: 从空样本池开始，第一轮仅凭电磁知识生成候选。
  use_initial_parquet = true

}

antenna {
  # 九个天线设计变量。min/max 定义闭区间，unit 和 meaning 会进入 LLM 提示词。
  # 所有几何变量均使用连续数值，不做 low/mid/high 三等分。
  variables {
    a {
      # a 的最小合法值，表示基板长度下限，单位由 unit 指定。
      min = 100.0
      # a 的最大合法值，表示基板长度上限。
      max = 150.0
      # a 的物理单位；当前项目所有几何变量均使用毫米。
      unit = "mm"
      # a 的英文物理含义，会直接写入面向 LLM 的变量范围说明。
      meaning = "substrate length"
    }
    b {
      # b 的最小合法值，表示基板宽度下限。
      min = 40.0
      # b 的最大合法值，表示基板宽度上限。
      max = 80.0
      # b 的物理单位。
      unit = "mm"
      # b 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "substrate width"
    }
    l1 {
      # l1 的最小合法值，表示上半部缝隙长度下限。
      min = 15.0
      # l1 的最大合法值，表示上半部缝隙长度上限。
      max = 45.0
      # l1 的物理单位。
      unit = "mm"
      # l1 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "upper slot length"
    }
    l2 {
      # l2 的最小合法值，表示中间缝隙长度下限。
      min = 5.0
      # l2 的最大合法值，表示中间缝隙长度上限。
      max = 15.0
      # l2 的物理单位。
      unit = "mm"
      # l2 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "middle slot length"
    }
    l3 {
      # l3 的最小合法值，表示下半部缝隙长度下限。
      min = 15.0
      # l3 的最大合法值，表示下半部缝隙长度上限。
      max = 45.0
      # l3 的物理单位。
      unit = "mm"
      # l3 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "lower slot length"
    }
    s1 {
      # s1 的最小合法值，表示上半部缝隙宽度下限。
      min = 0.5
      # s1 的最大合法值，表示上半部缝隙宽度上限。
      max = 1.5
      # s1 的物理单位。
      unit = "mm"
      # s1 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "upper slot width"
    }
    s2 {
      # s2 的最小合法值，表示中间缝隙宽度下限。
      min = 2.0
      # s2 的最大合法值，表示中间缝隙宽度上限；当前设定为 10 mm。
      max = 10.0
      # s2 的物理单位。
      unit = "mm"
      # s2 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "middle slot width"
    }
    s3 {
      # s3 的最小合法值，表示下半部缝隙宽度下限。
      min = 0.2
      # s3 的最大合法值，表示下半部缝隙宽度上限。
      max = 1.6
      # s3 的物理单位。
      unit = "mm"
      # s3 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "lower slot width"
    }
    f_l {
      # f_l 的最小合法值，表示馈线长度下限。
      min = 5.0
      # f_l 的最大合法值，表示馈线长度上限。
      max = 15.0
      # f_l 的物理单位。
      unit = "mm"
      # f_l 的英文物理含义，会直接进入 LLM 提示词。
      meaning = "feed-line length"
    }
  }

  targets {
    # 低频目标谐振频率，单位 GHz。该值会进入提示词、S11 插值和停止条件。
    low_frequency_ghz = 2.45

    # 高频目标谐振频率，单位 GHz。该值会进入提示词、S11 插值和停止条件。
    high_frequency_ghz = 4.5

    # 两个固定目标频率处的 S11 合格阈值，单位 dB。
    # S11 越负越好，因此 -12 dB 满足 -10 dB 阈值，而 -8 dB 不满足。
    s11_threshold_db = -15.0

    # 实际谐振点相对对应目标频率允许的最大绝对偏差，单位 GHz。
    # 只有两个实际谐振点都在此容差内，最终停止条件才可能成立。
    resonance_tolerance_ghz = 0.01
  }

  resonance_detection {
    # 两个独立谐振点之间允许的最小频率间隔，单位 GHz。
    # 用于避免把同一谐振谷附近的多个离散最低点误判为双谐振；如果只能确认
    # 第一个谐振而第二个谐振无法通过此检查，提取结果会标记 resonance_count=1。
    min_separation_ghz = 0.25

    # 局部最低点相对于周围曲线必须具备的最小突出度，单位 dB。
    # 数值越大，检测越严格，可减少由微小波动或噪声造成的伪谐振点；如果只有
    # 一个谷值通过检查，则输出 resonance_count=1，另一个槽位用 0 表示缺失。
    min_prominence_db = 1.0

    # 两个谐振谷之间曲线“鞍部”相对谷底所需的最小回升量，单位 dB。
    # 用于确认两个最低点确实属于相互独立的谐振谷；第二个谷未通过时保留第一
    # 个有效谐振并输出 resonance_count=1，而不是把整个样本判为无谐振。
    min_saddle_rise_db = 1.5

    # 对原始 S11 曲线进行移动平均时使用的窗口点数。必须为正奇数。
    # 增大可抑制孤立噪声，但过大会抹平窄谐振谷；3 表示当前点及左右各 1 点。
    smoothing_window_points = 3

    # scipy 初筛局部谷时，初筛突出度相对于 min_prominence_db 的比例系数。
    # 实际初筛阈值取 max(peak_prominence_scale * min_prominence_db,
    # peak_prominence_floor_db)，随后仍会用完整 min_prominence_db 做最终检查。
    peak_prominence_scale = 0.5

    # scipy 初筛突出度的绝对下限，单位 dB。用于避免把非常细小的数值波动当作候选谷。
    peak_prominence_floor_db = 0.4

    # 在平滑曲线找到候选谷后，回到原始曲线左右搜索真实谷底的半窗口点数。
    # 1 表示检查候选点及其左右各 1 点；设得过大可能跳到邻近的其他谷。
    refinement_half_window_points = 1

    # 输出谐振频率和谐振深度时保留的小数位数。它会影响零容差停止条件的精度，
    # 因此若修改该值，也应同步评估 resonance_tolerance_ghz 是否仍然合理。
    result_decimal_places = 2
  }
}

score {
  # 下面的分数只用于样本排名和 LLM 证据选取，不参与优化成功判断。
  # 成功判断直接检查双谐振、实际谐振频率误差和两个目标频率处的 S11 阈值。
  low_band_weight = 0.5
  high_band_weight = 0.5
  excellent_s11_db = -15.0
  # 实际谐振频率误差的指数质量尺度（GHz）：q_f=exp(-abs(error)/scale)。
  resonance_error_scale_ghz = 0.05
  # 排名分数 R=frequency_weight*q_f+s11_weight*q_s。
  frequency_weight = 0.6
  s11_weight = 0.4
  # 非双谐振样本的显式排名惩罚，单位与 R 相同。仅当检测结果缺少第二个
  # 独立谐振时扣除；默认 0 保持旧项目分数兼容，可按需要手动调大。
  non_dual_resonance_penalty = 0.75
}

optimization {
  # 最大优化迭代轮数。达到此轮数仍未满足全部停止条件时，程序保存当前最优样本后结束。
  max_iterations = 80

  # 摘要池持久化保存的最高分样本数量。完整池始终保存全部已评估样本；
  # 该值必须不小于 top_k，默认保留得分最高的 40 条简要摘要。
  summary_pool_size = 40

  # 输入采样 LLM 的高分真实样本数量。真实样本不足时自动使用全部已有样本。
  top_k = 20

  # 采样 LLM 每轮必须生成的候选设计数量，即提示词中的 N。
  # LLM 返回的有效候选数量不等于该值时，本轮调用会被判定为失败。
  proposals_per_iteration = 2

  # 候选重复判定容差。比较前先把所有变量归一化到 [0,1]，
  # 如果各维最大绝对差不超过该值，则视为重复设计并进入代码扰动流程。
  duplicate_tolerance = 1e-6

  # 设计变量保留的小数位数。当前项目要求固定为 2，配置验证会拒绝其他值。
  variable_decimal_places = 2

  # 重复候选扰动公式中的 alpha：
  # x_new=clip(x+r*alpha*(max-min), min, max)，其中 r~U(-1,1)。
  # 0.10 表示单次对每个变量最多按该变量全局范围的 10% 扰动。
  # 增大可更快离开重复点，但也更容易破坏 LLM 提出的局部协同设计。
  duplicate_perturbation_alpha = 0.10

  # 一个重复候选允许重新采样随机扰动的最大次数。每次都会重新生成九个随机数；
  # 达到该次数后仍与历史或本轮候选重复，程序会明确报错而不是静默丢弃。
  duplicate_perturbation_max_attempts = 100

  # LLM 候选出现越界、非数值或非有限变量时，修复随机流使用 seed + iteration*本值。
  # 该数只用于把不同轮次的伪随机流分开，通常无需调节；修改后会改变可复现的修复结果。
  candidate_repair_seed_iteration_stride = 1009

  # 重复候选扰动随机流使用 seed + iteration*本值。用途同上，仅控制可复现随机流。
  duplicate_perturbation_seed_iteration_stride = 7919

  # mock 采样 LLM 中，围绕当前最佳真实样本生成局部候选时使用的高斯标准差，
  # 以每个变量合法范围的比例表示。它只影响 provider=mock 的软件流程测试。
  mock_sampling_local_std_fraction = 0.10

  # mock 采样 LLM 每轮从全局均匀随机生成的候选数量；其余 mock 候选在最佳样本附近生成。
  # 必须位于 0 到 proposals_per_iteration 之间，只用于测试探索/开发流程。
  mock_sampling_global_proposal_count = 1

  # mock 采样 LLM 随机流使用 seed + iteration*本值；只影响 provider=mock 的可复现候选。
  mock_sampling_seed_iteration_stride = 1
}

llm {
  # 单次模块调用最多尝试次数。失败包括连接异常、接口异常、空响应或无法解析为 JSON 对象；
  # 候选字段数量等更具体的业务结构由 Agent 在响应解析成功后另行校验。
  # 当前默认值为 5；连续五次失败后程序抛出 LlmConnectionError 并退出。
  max_connection_attempts = 500

  # 两次 LLM 重试之间的等待秒数。
  retry_delay_seconds = 30

  # 单次 HTTP 请求超时时间，单位秒。超时后该次请求计为失败并进入重试。
  request_timeout_seconds = 120.0

  # 发送给采样 LLM 的提示词最大字符数。用于防止 TOP-K 样本增长后请求异常膨胀。
  max_prompt_characters = 120000

  # 正式请求的 system message。采样 LLM 使用 user prompt 中的 TOP-K 真实样本生成候选。
  system_prompt = "You are a precise antenna design agent. Return only valid JSON."

  # OpenAI SDK 自身的隐式重试次数。项目外层已经有 max_connection_attempts，默认设 0
  # 可以保证日志中的一次 attempt 就对应一次真实 HTTP 请求，避免重试次数相乘。
  sdk_max_retries = 0

  preflight {
    # 是否在每次正式大提示词之前先发一个极短 JSON 请求检查相同模型端点。
    enabled = true

    # true 表示预检失败时不再发送正式大提示词；false 表示只记录警告后继续尝试正式请求。
    block_on_failure = true

    # 预检单次请求超时，单位秒。它应明显短于正式请求超时，以便快速识别网关故障。
    timeout_seconds = 20.0

    # 预检允许的最大输出 token 数；只需容纳 {"status":"ok"}。
    max_output_tokens = 5000

    # 预检温度。设为 0 可最大限度稳定 JSON 返回。
    temperature = 0.5

    # 采样 LLM 使用这组预检消息。预检只接受一个顶层 JSON object；
    # JSON array、Markdown 代码块、解释、推理过程或对象外的任何文字都会导致预检失败。
    system_prompt = "You are a strict JSON-only connectivity-check responder. Return exactly one valid JSON object and nothing else. Do not return a JSON array. Do not use Markdown code fences. Do not include explanations, reasoning, labels, prefixes, suffixes, or any text outside the JSON object."
    user_prompt = "Return exactly this single JSON object: {\"status\":\"ok\"}. The response must start with { and end with }. The top-level value must be an object, not an array. It must contain exactly one key named \"status\" whose string value is exactly \"ok\". Output no Markdown and no additional text."
  }

  # sampling {
  #   # 采样指导模块使用的厂商。合法值：openai、deepseek、qwen、mock；mock 仅用于工作流测试。
  #   provider = "openai"

  #   # 采样模块的 OpenAI 兼容 API 基础地址，必须与 provider 对应。
  #   base_url = "https://api.clawto.link/v1"

  #   # 采样模块 API 密钥的直接配置值。建议保持为空并通过 api_key_env 指定的环境变量提供，避免密钥入库。
  #   api_key = ""

  #   # 采样模块读取 API 密钥的环境变量名称，仅在 api_key 为空时使用。
  #   api_key_env = "OPENAI_API_KEY"

  #   # 采样模块调用的具体模型 ID；运行日志会明确记录该值。
  #   model_id = "gpt-5.6-terra"

  #   # 采样模块温度。较高值增加候选多样性，过高可能降低 JSON 格式遵循稳定性。
  #   temperature = 0.5

  #   # 采样模块单次响应允许的最大输出 token 数，需要足以容纳 N 个完整候选及理由。
  #   max_output_tokens = 200000

  #   # 采样模块英文提示词模板路径。模板会在运行时填入候选数、阈值、TOP-K 和样本摘要。
  #   prompt_template = "prompts/sampling_guidance.md"
  # }

  sampling {
    # 采样指导模块使用的厂商。合法值：openai、deepseek、qwen、mock；mock 仅用于工作流测试。
    provider = "deepseek"

    # 采样模块的 OpenAI 兼容 API 基础地址，必须与 provider 对应。
    base_url = "https://api.deepseek.com"

    # 采样模块 API 密钥的直接配置值。建议保持为空并通过 api_key_env 指定的环境变量提供，避免密钥入库。
    api_key = ""

    # 采样模块读取 API 密钥的环境变量名称，仅在 api_key 为空时使用。
    api_key_env = "DEEPSEEK_API_KEY"

    # 采样模块调用的具体模型 ID；运行日志会明确记录该值。
    model_id = "deepseek-v4-pro"

    # 采样模块温度。较高值增加候选多样性，过高可能降低 JSON 格式和规则遵循稳定性。
    temperature = 1

    # 采样模块单次响应允许的最大输出 token 数，需要足以容纳 N 个完整候选及理由。
    max_output_tokens = 200000

    # 采样模块英文提示词模板路径。模板会在运行时填入候选数、阈值、TOP-K 和完整指导手册。
    prompt_template = "prompts/sampling_guidance.md"
  }

  # sampling {
  #   # 采样指导模块使用的厂商。合法值：openai、deepseek、qwen、mock；mock 仅用于工作流测试。
  #   provider = "deepseek"

  #   # 采样模块的 OpenAI 兼容 API 基础地址，必须与 provider 对应。
  #   base_url = "https://sapi.nyro.lol"

  #   # 采样模块 API 密钥的直接配置值。建议保持为空并通过 api_key_env 指定的环境变量提供，避免密钥入库。
  #   api_key = ""

  #   # 采样模块读取 API 密钥的环境变量名称，仅在 api_key 为空时使用。
  #   api_key_env = "DEEPSEEK_API_KEY"

  #   # 采样模块调用的具体模型 ID；运行日志会明确记录该值。
  #   model_id = "deepseek-v4.1-flash"

  #   # 采样模块温度。较高值增加候选多样性，过高可能降低 JSON 格式和规则遵循稳定性。
  #   temperature = 1

  #   # 采样模块单次响应允许的最大输出 token 数，需要足以容纳 N 个完整候选及理由。
  #   max_output_tokens = 200000

  #   # 采样模块英文提示词模板路径。模板会在运行时填入候选数、阈值、TOP-K 和完整指导手册。
  #   prompt_template = "prompts/sampling_guidance.md"
  # }


  provider_presets {
    # OpenAI 厂商预设。采样模块主要读取自身的 base_url/api_key_env；
    # 此处集中保留标准值，便于复制到 sampling 配置中。
    openai {
      # OpenAI 官方兼容接口地址。
      base_url = "https://api.clawto.link/v1"
      # OpenAI API 密钥的推荐环境变量名称。
      api_key_env = "OPENAI_API_KEY"
    }

    # DeepSeek 厂商预设，可用于替换采样模块的对应配置。
    deepseek {
      # DeepSeek 的 OpenAI 兼容接口地址。
      base_url = "https://api.deepseek.com"
      # DeepSeek API 密钥的推荐环境变量名称。
      api_key_env = "DEEPSEEK_API_KEY"
    }

    # 千问（DashScope OpenAI 兼容接口）厂商预设。
    qwen {
      # 千问 DashScope 的 OpenAI 兼容接口地址。
      base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
      # 千问 API 密钥的推荐环境变量名称。
      api_key_env = "QWEN_API_KEY"
    }
  }
}

simulation {
  # 仿真接入模式：pyaedt 使用项目内置的真实 CPW 双频天线脚本自动建模、求解和导出；
  # manual 表示人工运行 HFSS 并回填 Parquet；command 表示调用自定义外部命令；
  # mock 表示生成确定性的测试曲线，只能验证流程，不能作为真实天线证据。
  # 生产优化通过独立 ele_sim Client/Worker 远程提交；本地 pyaedt/manual/command/mock
  # 仍保留在 simulator.py 供兼容测试，但主循环使用 remote Client。
  mode = "remote"

  # manual 模式等待单个 HFSS 响应 Parquet 的最长时间，单位秒；超时后本轮报错终止。
  response_timeout_seconds = 3600

  # manual 模式检查响应文件是否出现的轮询间隔，单位秒。
  poll_interval_seconds = 5

  # 写出 HFSS 仿真请求 JSON 的目录。每个请求包含迭代号、九个变量和预期输出路径。
  request_dir = ${project.runtime_dir}"/hfss_requests"

  # 读取 HFSS 评估 Parquet 包的目录。文件名必须与请求中的预期输出文件一致。
  response_dir = ${project.runtime_dir}"/hfss_responses"

  # command 模式的外部命令模板。可使用 {request_json}、{output_parquet} 和 {iteration} 占位符。
  # manual 或 mock 模式可保持为空；command 模式为空会直接报错。
  command_template = ""

  pyaedt {
    # 以下只保留 PyAEDT 子进程的运行环境与输出位置。
    # 材料、基板、CPW、铜厚、空气盒、端口、参考阻抗、Setup 和 Sweep 等固定
    # 建模/求解参数全部固化在 llmo/hfss_runner.py，并与 PSO 的 cpw_hfss_runner.py 对齐。

    # 留空时使用启动主优化程序的同一个 Python；如果 PyAEDT 安装在独立环境，填写其 python.exe。
    python_executable = ""

    # 保持上传并已在本地调通脚本中的 AEDT 版本设置。
    aedt_version = "2023.2"

    # 保持上传脚本默认值：默认打开 AEDT 图形界面。
    non_graphical = false

    # 每轮独立 HFSS 工程的输出目录。工程名包含微秒时间戳和迭代号，避免相互覆盖。
    project_dir = ${project.runtime_dir}"/hfss_projects"
  }

  mock {
    # mock 曲线扫频起点，单位 GHz。
    frequency_start_ghz = 1.5

    # mock 曲线扫频终点，单位 GHz；必须覆盖两个目标频率和可能的谐振偏移范围。
    frequency_end_ghz = 5.5

    # mock 曲线的等间距频率点数量。数量越多曲线越细，但测试文件和计算量也会增加。
    frequency_points = 801

    # mock 曲线叠加的高斯噪声标准差，单位 dB。设为 0 可得到完全确定的测试结果。
    noise_std_db = 0.0

    # mock 噪声随机流使用 seed + iteration*本值；只影响测试曲线的可复现噪声。
    noise_seed_iteration_stride = 1

    # 以下参数只定义软件测试用的合成双洛伦兹谷，绝不能解释成真实天线物理系数。
    # 低频 mock 谐振以真实低频目标为基准，并受归一化 l1 与 f_l 控制。
    low_l1_center = 0.55
    low_l1_shift_ghz = 0.42
    low_feed_center = 0.50
    low_feed_shift_ghz = -0.18

    # 高频 mock 谐振以真实高频目标为基准，并受归一化 l3 与 l2 控制。
    high_l3_center = 0.45
    high_l3_shift_ghz = 0.38
    high_l2_center = 0.50
    high_l2_shift_ghz = 0.14

    # 两个频带达到最深匹配时，对应槽宽/基板变量的归一化理想位置及耦合权重。
    low_s1_alignment_center = 0.45
    low_b_alignment_center = 0.55
    low_b_alignment_weight = 0.60
    high_s3_alignment_center = 0.55
    high_s2_alignment_center = 0.50
    high_s2_alignment_weight = 0.50

    # 合成曲线的最大谷深、每单位失配造成的谷深衰减、失配截断值及远离谐振时基线。
    maximum_resonance_depth_db = 20.0
    depth_reduction_per_alignment_db = 8.0
    alignment_cap = 1.5
    baseline_s11_db = -1.0

    # 低频和高频洛伦兹谷的半宽参数，单位 GHz；值越大，合成谐振谷越宽。
    low_linewidth_ghz = 0.075
    high_linewidth_ghz = 0.085
  }
}

remote {
  # 数据库连接串建议只放在环境变量中，不写入仓库。
  database_url = ""
  database_url_env = "ELE_SIM_DATABASE_URL"
  # 必须与远程 Worker 注册的 simulation_type 完全一致。
  simulation_type = "ds_one_s11"
  # simulation_type = "NDUNSC_s11_laptop" 
  priority = 0
  max_retries = 3
  task_timeout_seconds = 3600
  wait_timeout_seconds = 12000
  poll_interval_seconds = 2
  progress_interval_seconds = 45
}

# Worker 端与 Client 共用本文件。将 HFSS 固定建模/求解参数集中在这里，
# 远程机器只需部署 project.conf、plugins/worker_simulation.py 和 plugins/_lib/。
model {
  h_sub_mm = 1.6
  s_mm = 3.0
  g_mm = 0.42
  copper_thickness_mm = 0.035
  wavelength_mm = 150.0
  substrate_permittivity = 4.3
  substrate_loss_tangent = 0.02
}

hfss {
  version = "2023.2"
  project_dir = "./hfss_remote"
  non_graphical = false
  max_runtime_seconds = 3600
  setup_name = "Setup_NDUNSC"
  sweep_name = "Sweep_NDUNSC"
  setup_frequency_ghz = 4.0
  sweep_start_ghz = 2.0
  sweep_stop_ghz = 6.0
  sweep_step_ghz = 0.01
  s11_expression = "dB(S(P1_CPW,P1_CPW))"
  max_passes = 30
  min_passes = 2
  min_converged_passes = 2
  max_delta_s = 0.02
}

logging {
  # 运行日志最低等级，例如 debug、info、warning、error。无效值会回退到 INFO。
  level = "info"

  # 是否把运行日志同时打印到终端。无论该值为何，日志文件都会正常写入。
  console = true

  # 每次运行目录中的普通流程日志文件名，记录迭代阶段、评分、重训练和异常等信息。
  run_log_name = "run.log"

  # 每次运行目录中的 LLM 交互 JSON 文件名。内容是带缩进的 JSON 数组，
  # 按 sequence 顺序记录完整提示词、响应、重试和错误，方便直接人工阅读。
  interaction_log_name = "llm_interactions.json"
}
